[package]
name = "switchboard"
version = "0.1.0"
edition = "2024"

[lib]
name = "switchboard_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Devices_Display",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Memory",
  "Win32_System_DataExchange",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_Graphics_Imaging",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
